site_name: Fluxio Documentation
site_description: Modern, lightweight, real-time visualization engine for Python, Jupyter, Terminal, and AI Chatbots.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: slate
      primary: light blue
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

nav:
  - Home: index.md
  - Core Concepts:
      - Styling & Themes: styling.md
      - Outputs & Exports: outputs.md
  - Charts & Widgets:
      - Number: charts/number.md
  - AI & LLM Integration:
      - Guide & Prompting: ai-integration.md
      - llms.txt: llms.txt
      - llms-full.txt: llms-full.txt
      - API Stub (fluxio.pyi): fluxio.pyi
