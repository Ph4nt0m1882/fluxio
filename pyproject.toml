[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluxio"
version = "0.1.0"
description = "Modern, lightweight, real-time visualization & simulation engine for Python, Jupyter, Web, and AI chatbots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4.0",
    "websockets>=13.0",
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fluxio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
